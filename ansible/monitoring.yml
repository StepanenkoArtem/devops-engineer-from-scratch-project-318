- name: Prometheus
  hosts: monitoring
  become: true

  pre_tasks:
    - name: Install docker
      ansible.builtin.include_role:
        name: geerlingguy.docker

    - name: Create a docker network
      community.docker.docker_network:
        name: "{{ monitoring_network }}"
        ipam_config:
          - subnet: "{{ monitoring_subnet }}"

    - name: Configure public ports
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
      loop: "{{ public_ports }}"

    - name: Configure private ports
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        src: "{{ vpc_net }}"
      loop: "{{ monitoring_ports }}"

    - name: Enable firewall
      community.general.ufw:
        state: enabled
        default: deny

  roles:
    - prepare_nginx
    - prometheus.prometheus.node_exporter
    - geerlingguy.nginx
    - prometheus
    - loki
    - grafana

  tasks:
    - name: Run handlers before restarting nginx
      ansible.builtin.meta: flush_handlers

    - name: Reload nginx
      ansible.builtin.systemd_service:
        name: nginx
        state: reloaded
      changed_when: false

    - name: Set up TLS certificates
      ansible.builtin.include_role:
        name: certbot_setup
