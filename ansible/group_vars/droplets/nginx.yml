nginx_remove_default_vhost: true
csp_policy: >-
  default-src 'self';
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
  font-src 'self' https://fonts.gstatic.com;
  img-src 'self' https://*.digitaloceanspaces.com data: blob:;
  connect-src 'self' https://*.digitaloceanspaces.com

nginx_vhost_http:
  - listen: "80"
    server_name: "{{ domain_name }}"
    filename: "80-{{ domain_name }}.conf"
    extra_parameters: |
      location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
      }
      location / {
        return 301 https://$host$request_uri;
      }

nginx_vhost_https:
  - listen: "443 ssl"
    ssl_protocols: "TLSv1.2 TLSv1.3"
    ssl_ciphers: "HIGH:!aNULL:!MD5"
    server_name: "{{ domain_name }}"
    filename: "443-{{ domain_name }}.conf"

    extra_parameters: |
      ssl_certificate /etc/letsencrypt/live/{{ domain_name }}/fullchain.pem;
      ssl_certificate_key /etc/letsencrypt/live/{{ domain_name }}/privkey.pem;

      add_header Strict-Transport-Security max-age=31536000 always;
      add_header X-Frame-Options DENY always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      add_header Content-Security-Policy "{{ csp_policy }}" always;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      location / {
        proxy_pass http://localhost:{{ deploy_app_port }};
      }

      location ~* \.(css|js|png|jpg|jpeg|webp|svg|ico|woff2)$ {
        proxy_pass http://localhost:{{ deploy_app_port }};
        expires 1d;
      }
