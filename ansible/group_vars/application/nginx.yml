nginx_remove_default_vhost: true
nginx_status_port: 8081
nginx_listen_ipv6: false

csp_policy: >-
  default-src 'self';
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
  font-src 'self' https://fonts.gstatic.com;
  img-src 'self' https://*.digitaloceanspaces.com data: blob:;
  connect-src 'self' https://*.digitaloceanspaces.com

nginx_log_format: |-
  escape=json
  '{'
    '"remote_addr":"$remote_addr",'
    '"remote_user":"$remote_user",'
    '"time_local":"$time_local",'
    '"request":"$request",'
    '"status":"$status",'
    '"body_bytes_sent":"$body_bytes_sent",'
    '"http_referer":"$http_referer",'
    '"http_user_agent":"$http_user_agent",'
    '"http_x_forwarded_for":"$http_x_forwarded_for"'
  '}'

nginx_vhost_http:
  - listen: "80"
    server_name: "{{ domain }}"
    filename: "80-{{ domain }}.conf"
    extra_parameters: |
      location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
      }
      location / {
        return 301 https://$host$request_uri;
      }

  - listen: "127.0.0.1:{{ nginx_status_port }}"
    server_name: "{{ domain }}"
    filename: "{{ nginx_status_port }}-{{ domain }}.conf"
    access_log: "off"
    extra_parameters: |
      location = /status {
        stub_status;
        allow 127.0.0.1;
        deny all;
      }

nginx_vhost_https:
  - listen: "443 ssl"
    ssl_protocols: "TLSv1.2 TLSv1.3"
    ssl_ciphers: "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305"
    server_name: "{{ domain }}"
    filename: "443-{{ domain }}.conf"

    extra_parameters: |
      ssl_certificate /etc/letsencrypt/live/{{ domain }}/fullchain.pem;
      ssl_certificate_key /etc/letsencrypt/live/{{ domain }}/privkey.pem;

      ssl_prefer_server_ciphers off;
      add_header Strict-Transport-Security max-age=31536000 always;
      add_header X-Frame-Options DENY always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      add_header Content-Security-Policy "{{ csp_policy }}" always;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      location / {
        proxy_pass http://127.0.0.1:{{ reverse_proxy_port }};
      }

      location ~* \.(css|js|png|jpg|jpeg|webp|svg|ico|woff2)$ {
        proxy_pass http://127.0.0.1:{{ reverse_proxy_port }};
        expires 1d;
      }
