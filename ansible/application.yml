- name: Application
  hosts: application
  become: true

  pre_tasks:
    - name: Ensure image_tag is a sha-<commit> tag
      ansible.builtin.assert:
        that:
          - image_tag is defined
          - image_tag | length > 0
          - image_tag is match('^sha-[0-9a-f]{7,40}$')
        fail_msg: "Docker image tag must be provided as sha-<commit> (7-40 hex chars)"

    - name: Create ssl_certificate directory
      ansible.builtin.file:
        path: /var/www/letsencrypt
        state: directory
        mode: "0755"

    - name: Configure public ports
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
      loop: "{{ public_ports }}"

    - name: Configure local ports
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        src: "127.0.0.1"
      loop: "{{ local_ports }}"

    - name: Enable firewall
      community.general.ufw:
        state: enabled
        default: deny

    - name: Ensure /etc/nginx directory exists
      ansible.builtin.file:
        path: /etc/nginx
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install passlib
      ansible.builtin.apt:
        name: "python3-passlib"
        state: present

    - name: Add a user to a password file and ensure permissions are set
      community.general.htpasswd:
        path: /etc/nginx/.htpasswd
        password: "{{ metrics_password }}"
        name: devops
        owner: root
        group: www-data
        mode: "0640"
      no_log: true

    - name: Check certificate
      ansible.builtin.stat:
        path: /etc/letsencrypt/live/{{ domain_name }}/fullchain.pem
      register: cert_file

    - name: Build nginx vhosts conditionally
      ansible.builtin.set_fact:
        nginx_vhosts: "{{ nginx_vhost_http + nginx_vhost_actuator + (nginx_vhost_https if cert_file.stat.exists else []) }}"

  roles:
    - prometheus.prometheus.node_exporter
    - geerlingguy.nginx
    - geerlingguy.certbot

  tasks:
    - name: Re-check certificate
      ansible.builtin.stat:
        path: /etc/letsencrypt/live/{{ domain_name }}/fullchain.pem
      register: cert_file

    - name: Re-build nginx vhosts conditionally to add TLS
      ansible.builtin.set_fact:
        nginx_vhosts: "{{ nginx_vhost_http + nginx_vhost_actuator + (nginx_vhost_https if cert_file.stat.exists else []) }}"

    - name: Re-Run nginx with TLS
      ansible.builtin.include_role:
        name: geerlingguy.nginx

    - name: Run handlers after TLS certificate issuance
      ansible.builtin.meta: flush_handlers

    - name: Set renew cert hook
      ansible.builtin.copy:
        src: certbot/deploy_auto_renew.sh
        dest: /etc/letsencrypt/renewal-hooks/deploy/
        owner: "root"
        mode: "0755"

    - name: Turn off certbot.timer
      ansible.builtin.systemd_service:
        name: certbot.timer
        enabled: false
        state: stopped

    - name: Run docker
      ansible.builtin.include_role:
        name: geerlingguy.docker

    - name: Deploy
      ansible.builtin.include_role:
        name: deploy
