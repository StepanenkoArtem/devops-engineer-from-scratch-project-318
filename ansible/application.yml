- name: Application
  hosts: application
  become: true

  pre_tasks:
    - name: Ensure image_tag is a sha-<commit> tag
      ansible.builtin.assert:
        that:
          - image_tag is defined
          - image_tag | length > 0
          - image_tag is match('^sha-[0-9a-f]{7,40}$')
        fail_msg: "Docker image tag must be provided as sha-<commit> (7-40 hex chars)"

    - name: Configure public ports
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
      loop: "{{ public_ports }}"

    - name: Configure private ports
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        src: "{{ vpc_net }}"
      loop: "{{ monitoring_ports }}"

    - name: Enable firewall
      community.general.ufw:
        state: enabled
        default: deny

  roles:
    - prepare_nginx
    - prometheus.prometheus.node_exporter
    - geerlingguy.nginx
    - nginx_exporter

  tasks:
    - name: Run handlers after roles to reload nginx
      ansible.builtin.meta: flush_handlers

    - name: Set up TLS certificates
      ansible.builtin.include_role:
        name: certbot_setup

    - name: Run docker
      ansible.builtin.include_role:
        name: geerlingguy.docker

    - name: Deploy
      ansible.builtin.include_role:
        name: deploy

    # After deploy: promtail needs the docker group and a running container to discover
    - name: Ship logs to Loki
      ansible.builtin.include_role:
        name: promtail
