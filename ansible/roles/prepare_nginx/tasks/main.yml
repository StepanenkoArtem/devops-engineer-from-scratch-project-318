- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 0
  changed_when: false

- name: Ensure /etc/nginx directory exists
  ansible.builtin.file:
    path: /etc/nginx
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Check TSL certificate
  ansible.builtin.stat:
    path: /etc/letsencrypt/live/{{ domain }}/fullchain.pem
  register: prepare_nginx_cert_file

- name: Build nginx vhosts conditionally  # noqa: var-naming[no-role-prefix] prefix is defined by geerlingguy.nginx contract
  ansible.builtin.set_fact:
    nginx_vhosts: "{{ nginx_vhost_http + (nginx_vhost_https if prepare_nginx_cert_file.stat.exists else []) }}"
