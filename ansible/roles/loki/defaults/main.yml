loki_release_version: "3.7.6"
loki_image: "grafana/loki:{{ loki_release_version }}"
loki_config_directory: "/etc/loki"
loki_config_path: "{{ loki_config_directory }}/loki.yml"

loki_data_mnt: "/loki"

# Chunks and index live in a dedicated Space: its key cannot reach the application's user files
loki_s3_bucket: "hexlet4-logs"
loki_s3_region: "fra1"
loki_s3_endpoint: "fra1.digitaloceanspaces.com"
loki_s3_access_key: "{{ vault_s3_logs_access_key }}"
loki_s3_secret_key: "{{ vault_s3_logs_secret_key }}"

# Same as the Prometheus default: no reason yet to keep logs longer than metrics
loki_retention_period: "15d"
