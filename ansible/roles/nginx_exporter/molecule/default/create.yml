- name: Create container instances
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Create containers from inventory
      community.docker.docker_container:
        name: "{{ item }}"
        hostname: "{{ item }}"
        image: "{{ hostvars[item].container_image }}"
        privileged: true
        cgroupns_mode: host
        volumes:
          - /sys/fs/cgroup:/sys/fs/cgroup:rw
        state: started
      loop: "{{ groups['molecule'] }}"

    - name: Wait for systemd inside the containers
      ansible.builtin.raw: systemctl is-system-running --wait
      register: nginx_exporter_test_systemd_state
      failed_when: (nginx_exporter_test_systemd_state.stdout | default('') | trim) not in ['running', 'degraded']
      until: nginx_exporter_test_systemd_state is not failed
      retries: 10
      delay: 3
      changed_when: false
      delegate_to: "{{ item }}"
      loop: "{{ groups['molecule'] }}"
