# Molecule scenario config. This file is what makes the directory a scenario:
# Molecule discovers scenarios by the molecule/*/molecule.yml pattern.

ansible:
  executor:
    args:
      ansible_playbook:
        - --inventory=inventory/
scenario:
  test_sequence:
    - destroy
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
