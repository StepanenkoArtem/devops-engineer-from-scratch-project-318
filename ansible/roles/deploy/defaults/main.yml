deploy_app_name: bulletins

deploy_docker_registry_repo: artemstepanenko
deploy_docker_container: "{{ app_container_name }}"
deploy_docker_image: "{{ deploy_docker_registry_repo }}/{{ deploy_app_name }}:{{ image_tag }}"

deploy_app_uid: 1001 # Should be the same as user id in application Dockerfile
deploy_app_base_dir: "/opt/{{ deploy_app_name }}"
deploy_tmp_path: "{{ deploy_app_base_dir }}/tmp"
deploy_log_path: "{{ deploy_app_base_dir }}/log"

deploy_web_log_level: "INFO" # DEBUG makes Spring log every HTTP request, scrapes included

# Host side comes from the service_ports registry; container side is passed to Spring via env,
# so the app listens exactly where Docker publishes it
deploy_http_host_port: "{{ service_ports.application }}"
deploy_http_container_port: 8080
deploy_actuator_bind_address: "{{ private_address }}"
deploy_actuator_host_port: "{{ service_ports.actuator }}"
deploy_actuator_container_port: 9090

deploy_db_url: "jdbc:postgresql://{{ db_host }}:{{ db_port }}/{{ db_name }}?sslmode={{ db_sslmode }}"
deploy_db_username: "{{ vault_db_username }}"
deploy_db_password: "{{ vault_db_password }}"

deploy_s3_bucket: "hexlet4-s3"
deploy_s3_region: "fra1"
deploy_s3_endpoint: "https://fra1.digitaloceanspaces.com"
deploy_s3_access_key: "{{ vault_s3_access_key }}"
deploy_s3_secret_key: "{{ vault_s3_secret_key }}"
