- name: Prepare volumes
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ deploy_app_uid }}"
    mode: "0755"
  loop:
    - "{{ deploy_log_path }}"
    - "{{ deploy_tmp_path }}"

- name: Start app container

  community.docker.docker_container:
    name: "{{ deploy_docker_container }}"
    image: "{{ deploy_docker_image }}"
    state: started
    pull: true
    restart_policy: unless-stopped
    ports:
      - "127.0.0.1:{{ deploy_http_host_port }}:{{ deploy_http_container_port }}"
      - "{{ deploy_actuator_bind_address }}:{{ deploy_actuator_host_port }}:{{ deploy_actuator_container_port }}"
    volumes:
      - "{{ deploy_log_path }}:/app/log"
      - "{{ deploy_tmp_path }}:/app/tmp"
    env:
      SPRING_PROFILES_ACTIVE: "prod"
      SERVER_PORT: "{{ deploy_http_container_port | string }}"
      MANAGEMENT_SERVER_PORT: "{{ deploy_actuator_container_port | string }}"

      SPRING_DATASOURCE_URL: "{{ deploy_db_url }}"
      SPRING_DATASOURCE_USERNAME: "{{ deploy_db_username }}"
      SPRING_DATASOURCE_PASSWORD: "{{ deploy_db_password }}"

      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB: "{{ deploy_web_log_level }}"

      STORAGE_S3_BUCKET: "{{ deploy_s3_bucket }}"
      STORAGE_S3_REGION: "{{ deploy_s3_region }}"
      STORAGE_S3_ENDPOINT: "{{ deploy_s3_endpoint }}"
      STORAGE_S3_ACCESSKEY: "{{ deploy_s3_access_key }}"
      STORAGE_S3_SECRETKEY: "{{ deploy_s3_secret_key }}"

      JAVA_OPTS: "-Xmx512m"
  no_log: "{{ no_log | default(true) }}"

- name: Application Health-check
  ansible.builtin.uri:
    url: "http://{{ deploy_actuator_bind_address }}:{{ deploy_actuator_host_port }}/actuator/health"
  register: deploy_result
  until: deploy_result.status | default(0) == 200
  delay: 5
  retries: 24
  no_log: "{{ no_log | default(true) }}"
