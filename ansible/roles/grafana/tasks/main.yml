- name: Create grafana provisioning directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ grafana_datasources_path }}"
    - "{{ grafana_dashboard_providers_path }}"
    - "{{ grafana_dashboards_path }}"
    - "{{ grafana_alerting_path }}"

- name: Copy datasource provisioning
  ansible.builtin.template:
    src: "datasources/{{ item }}.j2"
    dest: "{{ grafana_datasources_path }}/{{ item }}"
    owner: "root"
    group: "root"
    mode: "0644"
  loop:
    - prometheus.yml
    - loki.yml
  notify: Restart grafana

- name: Copy dashboard providers provisioning
  ansible.builtin.template:
    src: dashboard_providers/default.yml.j2
    dest: "{{ grafana_dashboard_providers_path }}/default.yml"
    owner: "root"
    group: "root"
    mode: "0644"
  notify: Restart grafana

- name: Copy contact points provisioning
  ansible.builtin.template:
    src: alerting/contact_points.yaml.j2
    dest: "{{ grafana_alerting_path }}/contact_points.yaml"
    owner: "root"
    group: "root"
    mode: "0644"
  notify: Restart grafana
  no_log: "{{ no_log | default(true) }}"

- name: Copy alert rules provisioning
  ansible.builtin.template:
    src: alerting/rules.yaml.j2
    dest: "{{ grafana_alerting_path }}/rules.yaml"
    owner: "root"
    group: "root"
    mode: "0644"
  notify: Restart grafana

- name: Copy provisioned dashboards
  ansible.builtin.copy:
    src: dashboards/
    dest: "{{ grafana_dashboards_path }}"
    owner: "root"
    group: "root"
    mode: "0644"
    directory_mode: "0755"
  notify: Restart grafana

- name: Copy provisioned alerting
  ansible.builtin.copy:
    src: alerting/
    dest: "{{ grafana_alerting_path }}"
    owner: "root"
    group: "root"
    mode: "0644"
    directory_mode: "0755"
  notify: Restart grafana

- name: Create Grafana data volume
  community.docker.docker_volume:
    name: grafana-data

- name: Create Grafana container
  community.docker.docker_container:
    name: grafana
    state: started
    image: "{{ grafana_image }}"
    volumes:
      - "{{ grafana_provisioning_path }}:{{ grafana_provisioning_path }}:ro"
      - "{{ grafana_dashboards_path }}:{{ grafana_dashboards_path }}:ro"
      - "grafana-data:/var/lib/grafana"
    networks:
      - name: "{{ grafana_docker_network }}"
    ports:
      - "127.0.0.1:{{ grafana_host_port }}:{{ grafana_container_port }}"
    env:
      GF_SERVER_HTTP_PORT: "{{ grafana_container_port | string }}"
      GF_SECURITY_ADMIN_USER: "{{ grafana_admin_user }}"
      GF_SECURITY_ADMIN_PASSWORD: "{{ grafana_admin_password }}"
      GF_SERVER_ROOT_URL: "{{ grafana_root_url }}"
      GF_SECURITY_CSRF_TRUSTED_ORIGINS: "{{ grafana_csrf_trusted_origin }}"

    restart_policy: unless-stopped
  no_log: "{{ no_log | default(true) }}"

- name: Wait for Grafana API
  ansible.builtin.uri:
    url: "{{ grafana_api_url }}/api/health"
  register: grafana_health
  until: grafana_health.status | default(0) == 200
  retries: 12
  delay: 5

- name: Look up viewer account
  ansible.builtin.uri:
    url: "{{ grafana_api_url }}/api/users/lookup?loginOrEmail={{ grafana_viewer_login }}"
    url_username: "{{ grafana_admin_user }}"
    url_password: "{{ grafana_admin_password }}"
    force_basic_auth: true
    status_code: [200, 404]
  register: grafana_viewer_lookup
  no_log: "{{ no_log | default(true) }}"

- name: Create viewer account
  ansible.builtin.uri:
    url: "{{ grafana_api_url }}/api/admin/users"
    method: POST
    url_username: "{{ grafana_admin_user }}"
    url_password: "{{ grafana_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      name: "{{ grafana_viewer_login }}"
      login: "{{ grafana_viewer_login }}"
      password: "{{ grafana_viewer_password }}"
      OrgId: 1
  when: grafana_viewer_lookup.status | default(0) == 404
  changed_when: true
  no_log: "{{ no_log | default(true) }}"
