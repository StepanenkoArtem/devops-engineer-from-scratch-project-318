- name: Create grafana provisioning directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ grafana_datasources_path }}"
    - "{{ grafana_dashboard_providers_path }}"
    - "{{ grafana_dashboards_path }}"
    - "{{ grafana_alerting_path }}"

- name: Copy datasource provisioning
  ansible.builtin.template:
    src: "datasources/{{ item }}.j2"
    dest: "{{ grafana_datasources_path }}/{{ item }}"
    owner: "root"
    group: "root"
    mode: "0644"
  loop:
    - prometheus.yml
    - loki.yml
  notify: Restart grafana

- name: Copy dashboard providers provisioning
  ansible.builtin.template:
    src: dashboard_providers/default.yml.j2
    dest: "{{ grafana_dashboard_providers_path }}/default.yml"
    owner: "root"
    group: "root"
    mode: "0644"
  notify: Restart grafana

- name: Copy contact points provisioning
  ansible.builtin.template:
    src: alerting/contact_points.yaml.j2
    dest: "{{ grafana_alerting_path }}/contact_points.yaml"
    owner: "root"
    group: "root"
    mode: "0644"
  notify: Restart grafana
  no_log: "{{ no_log | default(true) }}"

# TODO: the two `copy` tasks below sweep a whole directory, and `copy` never prunes.
# A file deleted from `files/dashboards/` or `files/alerting/` stays on the server and
# keeps being loaded by Grafana — it just disappears from git, which is the worst
# combination. Happened once with a leftover draft (`critical_temp.yaml`).
# Fix either way: an explicit file list (as in the datasources task above), or a task
# that removes destination files not present in the source.
- name: Copy provisioned dashboards
  ansible.builtin.copy:
    src: dashboards/
    dest: "{{ grafana_dashboards_path }}"
    owner: "root"
    group: "root"
    mode: "0644"
    directory_mode: "0755"
  notify: Restart grafana

- name: Copy provisioned alerting
  ansible.builtin.copy:
    src: alerting/
    dest: "{{ grafana_alerting_path }}"
    owner: "root"
    group: "root"
    mode: "0644"
    directory_mode: "0755"
  notify: Restart grafana

- name: Create Grafana data volume
  community.docker.docker_volume:
    name: grafana-data

# TODO: no memory limit, and the droplet is undersized. Grafana sits at ~605 MB of the
# host's 961 MiB with no swap, so the global OOM killer took it five times between
# 2026-08-08 and 2026-08-15 (`journalctl -k`). `restart_policy` hid the first four; the
# fifth left the container at `Up` with `PIDS 0`, and nginx served 502 for two days.
# Needs: a bigger host, an explicit `memory` limit, and a failure check from off-host —
# alert rules inside Grafana cannot report Grafana's own death. Nothing on this droplet
# can either: a cron job or a second container dies with the host. So the off-host check
# has to be a dead man's switch (the Prometheus `Watchdog` pattern): an always-firing
# alert pinged out to an external heartbeat service, which alerts when the pings stop.
# That covers the whole chain at once — Grafana, Prometheus, the host, and the Telegram
# delivery path. Note also that `HEALTHCHECK` alone would not have helped: it flips the
# container to `unhealthy`, but `restart_policy` does not act on that.
# Deferred: out of scope for the current course step.
- name: Create Grafana container
  community.docker.docker_container:
    name: grafana
    state: started
    image: "{{ grafana_image }}"
    volumes:
      - "{{ grafana_provisioning_path }}:{{ grafana_provisioning_path }}:ro"
      - "{{ grafana_dashboards_path }}:{{ grafana_dashboards_path }}:ro"
      - "grafana-data:/var/lib/grafana"
    networks:
      - name: "{{ monitoring_network }}"
    ports:
      - "127.0.0.1:3000:3000"
    env:
      GF_SECURITY_ADMIN_USER: "{{ grafana_admin_user }}"
      GF_SECURITY_ADMIN_PASSWORD: "{{ grafana_admin_password }}"
      GF_SERVER_ROOT_URL: "{{ grafana_root_url }}"
      GF_SECURITY_CSRF_TRUSTED_ORIGINS: "{{ grafana_csrf_trusted_origin }}"

    restart_policy: unless-stopped
  no_log: "{{ no_log | default(true) }}"

- name: Allow docker network to reach prometheus port
  community.general.ufw:
    rule: allow
    port: "{{ prometheus_port }}"
    proto: tcp
    from_ip: "172.16.0.0/12"
