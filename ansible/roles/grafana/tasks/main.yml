- name: Create grafana provisioning directory
  ansible.builtin.file:
    path: "{{ grafana_provisioning_directory }}"
    state: directory
    mode: "0755"

# - name: Create grafana rules directory
#   ansible.builtin.file:
#     path: "{{ grafana_provisioning_directory }}/rules"
#     state: directory
#     owner: "root"
#     group: "root"
#     mode: "0755"

- name: Copy datasource provisioning
  ansible.builtin.template:
    src: datasources/prometheus.yml.j2
    dest: "{{ grafana_provisioning_directory }}/datasources/prometheus.yml"
    owner: "root"
    group: "root"
    mode: "0644"
  notify: Restart grafana

- name: Copy dashboard provisioning
  ansible.builtin.copy:
    src: dashboards/
    dest: "{{ grafana_provisioning_directory }}/dashboards/"
    owner: "root"
    group: "root"
    mode: "0644"
  notify: Restart grafana

