- name: Create Grafana data volume
  community.docker.docker_volume:
    name: grafana-data

- name: Create Grafana container
  community.docker.docker_container:
    name: grafana
    state: started
    image: "{{ grafana_image }}"
    volumes:
      - "{{ grafana_provisioning_directory }}:{{ grafana_provisioning_directory }}:ro"
      - "grafana-data:/var/lib/grafana"
    networks:
      - name: "{{ monitoring_network }}"
    ports:
      - "127.0.0.1:3000:3000"
    restart_policy: unless-stopped

- name: Allow docker network to reach prometheus port
  community.general.ufw:
    rule: allow
    port: "{{ prometheus_port }}"
    proto: tcp
    from_ip: "172.16.0.0/12"
