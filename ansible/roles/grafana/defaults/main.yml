grafana_image: "grafana/grafana:{{ grafana_image_tag }}"
grafana_image_tag: "13.1.1-slim"
grafana_root_url: "https://{{ domain }}/"
grafana_csrf_trusted_origin: "https://{{ domain }}"

grafana_admin_user: "admin"
grafana_admin_password: "{{ vault_grafana_admin_password }}"

# Host side comes from the service_ports registry; container side is passed to Grafana via env
grafana_host_port: "{{ service_ports.grafana }}"
grafana_container_port: 3000
grafana_docker_network: "{{ monitoring_network }}"

# Prometheus and Loki are reached by container name over the shared docker network
grafana_prometheus_url: "http://{{ service_containers.prometheus }}:{{ service_ports.prometheus }}"
grafana_loki_url: "http://{{ service_containers.loki }}:{{ service_ports.loki }}"

grafana_telegram_bot_token: "{{ vault_tg_bot_token }}"
grafana_telegram_chat_id: "{{ vault_tg_chat_id }}"

grafana_config_root: "/etc/grafana"
grafana_provisioning_path: "{{ grafana_config_root }}/provisioning"
grafana_datasources_path: "{{ grafana_provisioning_path }}/datasources"
grafana_dashboard_providers_path: "{{ grafana_provisioning_path }}/dashboards"
grafana_alerting_path: "{{ grafana_provisioning_path }}/alerting"
grafana_dashboards_path: "{{ grafana_config_root }}/dashboards"
